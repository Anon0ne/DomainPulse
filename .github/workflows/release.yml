name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0-alpha"
        required: true
        default: v0.1.2-alpha

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python packaging/make_icon.py build
        env:
          QT_QPA_PLATFORM: offscreen
      - run: >
          pyinstaller --noconfirm --onefile --windowed --name DomainPulse
          --icon build/domain-pulse.ico --exclude-module tkinter --exclude-module cryptography run.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/DomainPulse.exe

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfuse2
      - run: pip install -r requirements.txt pyinstaller
      - run: python packaging/make_icon.py build
        env:
          QT_QPA_PLATFORM: offscreen
      - run: >
          pyinstaller --noconfirm --windowed --name DomainPulse
          --icon build/domain-pulse.png --exclude-module tkinter --exclude-module cryptography run.py
      - run: packaging/build_appimage.sh "${{ inputs.version || github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          name: Domain Pulse ${{ inputs.version || github.ref_name }}
          files: |
            artifacts/windows/DomainPulse.exe
            artifacts/linux/*.AppImage
          body: |
            Alpha build of Domain Pulse by [BizHostNC](https://bizhostnc.com).

            - **Windows:** download `DomainPulse.exe` and run it. SmartScreen may warn because the build is unsigned; choose "More info" then "Run anyway".
            - **Linux:** download the `.AppImage`, `chmod +x` it, and run it.
